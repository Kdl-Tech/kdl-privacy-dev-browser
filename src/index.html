<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- img-src autorise https: uniquement pour les favicons d'onglets (images, jamais de script). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self';" />
  <title>KDL Privacy Dev Browser</title>
  <script src="theme-boot.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="kdl/kdl-fonts-lagon.css" />
  <link rel="stylesheet" href="kdl/kdl-theme-light.css" />
  <link rel="stylesheet" href="kdl/kdl-theme-dark.css" />
  <link rel="stylesheet" href="kdl/kdl-theme.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="kdl/kdl-style-f.css" />
</head>
<body>
  <!-- Barre d'onglets -->
  <div id="tabbar">
    <img id="brand-logo" src="../assets/kdl-logo-tech.webp" alt="KDL TECH" title="KDL Privacy Dev Browser" />
    <span id="private-badge" class="private-badge hidden" title="" data-i18n-title="private.title">
      <svg viewBox="0 0 24 24"><path d="M3 11h18"/><path d="M6 11l2-6h8l2 6"/><circle cx="7.5" cy="16" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M10 16h4"/></svg><span data-i18n="private.badge">Navigation privée</span></span>
    <div id="tabs"></div>
    <button id="newtab" class="ico-btn" title="Nouvel onglet (Ctrl+T)" aria-label="Nouvel onglet" data-i18n-title="tb.newTabTitle" data-i18n-aria-label="tab.new">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Barre de navigation -->
  <header id="toolbar">
    <div class="nav-group">
      <button id="back" class="ico-btn" title="Précédent (Alt+←)" aria-label="Précédent" data-i18n-title="tb.backTitle" data-i18n-aria-label="tb.back">
        <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
      <button id="forward" class="ico-btn" title="Suivant (Alt+→)" aria-label="Suivant" data-i18n-title="tb.forwardTitle" data-i18n-aria-label="tb.forward">
        <svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></svg></button>
      <button id="reload" class="ico-btn" title="Recharger (Ctrl+R)" aria-label="Recharger" data-i18n-title="tb.reloadTitle" data-i18n-aria-label="tb.reload">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 5v6h-6"/></svg></button>
      <button id="home" class="ico-btn" title="Accueil" aria-label="Accueil" data-i18n-title="tb.home" data-i18n-aria-label="tb.home">
        <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg></button>
    </div>

    <form id="urlform" role="search">
      <span id="lock" class="lock" data-state="neutral" title="Sécurité de la connexion" data-i18n-title="tb.lock" aria-hidden="true"></span>
      <input id="urlbar" type="text" spellcheck="false" autocomplete="off" aria-label="Adresse ou recherche" data-i18n-aria-label="tb.urlAria"
             placeholder="Rechercher sur DuckDuckGo ou saisir une URL" data-i18n-placeholder="tb.urlPlaceholder" />
      <button id="btn-fav" class="ico-btn in-url" title="Ajouter aux favoris (Ctrl+D)" aria-label="Favori" data-i18n-title="fav.add" data-i18n-aria-label="fav.one">
        <svg viewBox="0 0 24 24"><path d="m12 4 2.5 5 5.5.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.5-.8z"/></svg>
      </button>
    </form>

    <div class="nav-group">
      <button id="btn-ai" class="ico-btn" title="KDL IA (assistant local)" data-i18n-title="tb.aiTitle" aria-label="KDL IA">
        <svg viewBox="0 0 24 24"><path d="m12 3 1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></svg></button>
      <button id="btn-favs" class="ico-btn" title="Favoris" aria-label="Favoris" data-i18n-title="favs.title" data-i18n-aria-label="favs.title">
        <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg></button>
      <button id="btn-shot" class="ico-btn" title="Capture d'écran" aria-label="Capture d'écran" data-i18n-title="tb.shot" data-i18n-aria-label="tb.shot">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
      <button id="btn-maj" class="ico-btn" type="button" hidden><span class="maj-pt" aria-hidden="true"></span><span id="maj-lib"></span></button>
      <button id="btn-theme" class="ico-btn" data-kdl-theme-toggle title="Thème clair / sombre" aria-label="Changer le thème" data-i18n-title="theme.toggleTitle" data-i18n-aria-label="theme.toggle" aria-pressed="false">
        <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <div class="menu-wrap">
        <button id="btn-menu" class="ico-btn" title="Menu" aria-label="Menu" data-i18n-title="tb.menu" data-i18n-aria-label="tb.menu" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
        <div id="menu" class="menu hidden" role="menu" aria-label="Outils" data-i18n-aria-label="tb.tools">
          <button id="m-newtab" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="tab.new">Nouvel onglet</span><kbd>Ctrl+T</kbd></button>
          <button id="m-newwin" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span data-i18n="menu.newWindow">Nouvelle fenêtre</span><kbd>Ctrl+N</kbd></button>
          <button id="m-private" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M3 11h18"/><path d="M6 11l2-6h8l2 6"/><circle cx="7.5" cy="16" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path d="M10 16h4"/></svg><span data-i18n="menu.newPrivate">Nouvelle fenêtre de navigation privée</span><kbd>Ctrl+⇧+N</kbd></button>
          <div class="menu-sep"></div>
          <button id="m-history" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg><span data-i18n="menu.history">Historique</span><kbd>Ctrl+H</kbd></button>
          <button id="m-downloads" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg><span data-i18n="dl.title">Téléchargements</span><kbd>Ctrl+J</kbd></button>
          <button id="m-favs" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg><span data-i18n="favbar.manage">Gérer les favoris</span><kbd>Ctrl+⇧+O</kbd></button>
          <button id="m-favbar" class="menu-item" role="menuitemcheckbox" aria-checked="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 6.5h4"/></svg><span data-i18n="menu.showFavbar">Afficher la barre de favoris</span><kbd>Ctrl+⇧+B</kbd></button>
          <div class="menu-sep"></div>
          <div class="menu-zoom" role="group" aria-label="Zoom" data-i18n-aria-label="menu.zoom">
            <span class="mz-label" data-i18n="menu.zoom">Zoom</span>
            <button id="mz-out" class="mz-btn" title="Réduire" data-i18n-title="menu.zoomOut" aria-label="Réduire" data-i18n-aria-label="menu.zoomOut"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
            <button id="mz-val" class="mz-val" title="Taille normale" data-i18n-title="menu.zoomReset">100 %</button>
            <button id="mz-in" class="mz-btn" title="Agrandir" data-i18n-title="menu.zoomIn" aria-label="Agrandir" data-i18n-aria-label="menu.zoomIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button id="mz-full" class="mz-btn" title="Plein écran (F11)" data-i18n-title="menu.fullscreen" aria-label="Plein écran" data-i18n-aria-label="menu.fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          </div>
          <div class="menu-sep"></div>
          <button id="m-print" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span data-i18n="menu.print">Imprimer…</span><kbd>Ctrl+P</kbd></button>
          <button id="m-find" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><span data-i18n="menu.find">Rechercher dans la page…</span><kbd>Ctrl+F</kbd></button>
          <button id="m-save" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3"/><path d="M8 21v-7h8v7"/></svg><span data-i18n="menu.savePage">Enregistrer la page sous…</span><kbd>Ctrl+S</kbd></button>
          <button id="m-source" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/><path d="m13 5-2 14"/></svg><span data-i18n="menu.viewSource">Afficher le code source</span><kbd>Ctrl+U</kbd></button>
          <div class="menu-sep"></div>
          <button id="btn-reader" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4Z"/><path d="M20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7Z"/></svg><span data-i18n="menu.reader">Mode lecture</span></button>
          <button id="btn-info" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg><span data-i18n="menu.info">Infos page</span></button>
          <button id="btn-audit" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 3 8 7 10 4-2 7-5.6 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span data-i18n="menu.audit">Audit léger</span></button>
          <button id="btn-devtools" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="m9 8-4 4 4 4"/><path d="m15 8 4 4-4 4"/></svg><span>DevTools</span></button>
          <button id="btn-clean" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/></svg><span data-i18n="menu.clean">Effacer le site</span></button>
          <button id="btn-downloads" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4"/><path d="M5 21h14"/></svg><span data-i18n="dl.title">Téléchargements</span></button>
          <button id="btn-turbodl" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg><span>TurboDL</span></button>
          <button id="btn-onion" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="m12 2 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4"/><path d="m4 17 8 4 8-4"/></svg><span>Onion Search</span></button>
          <button id="btn-site" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 3 8 7 10 4-2 7-5.6 7-10V6l-7-3Z"/><path d="M12 8v4l2 1"/></svg><span data-i18n="site.title">Confidentialité du site</span></button>
          <button id="btn-workspaces" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="15" width="7" height="5" rx="1"/><rect x="14" y="15" width="7" height="5" rx="1"/></svg><span data-i18n="ws.title">Espaces de travail</span></button>
          <button id="btn-devbox" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M3 5h18v11H3z"/><path d="M3 20h18"/><path d="m8 9-2 2 2 2"/><path d="m12 13h3"/></svg><span data-i18n="devbox.title">Outils développeur</span></button>
          <div class="menu-sep"></div>
          <button id="btn-settings" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 3 8 7 10 4-2 7-5.6 7-10V6l-7-3Z"/></svg><span data-i18n="settings.title">Confidentialité</span></button>
          <button id="btn-about" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.6"/><path d="M12 17h.01"/></svg><span data-i18n="about.title">À propos</span></button>
          <div class="menu-sep"></div>
          <button id="m-quit" class="menu-item" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M10 4H5v16h5"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg><span data-i18n="menu.quit">Quitter</span><kbd>Ctrl+Q</kbd></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Barre de favoris (Ctrl+⇧+B) -->
  <nav id="favbar" aria-label="Barre de favoris" data-i18n-aria-label="favbar.label"></nav>

  <!-- Barre responsive (masquée par défaut, Ctrl+Shift+M) -->
  <div id="responsive-bar" class="hidden">
    <span data-i18n="resp.label">Affichage :</span>
    <button data-w="0" class="active" data-i18n="resp.desktop">Bureau</button>
    <button data-w="768" data-i18n="resp.tablet">Tablette</button>
    <button data-w="390" data-i18n="resp.mobile">Mobile</button>
  </div>

  <main id="viewport">
    <div id="findbar" class="findbar hidden" role="search">
      <input id="find-q" type="text" spellcheck="false" autocomplete="off" placeholder="Rechercher dans la page" data-i18n-placeholder="find.placeholder" aria-label="Rechercher dans la page" data-i18n-aria-label="find.placeholder" />
      <span id="find-count" class="find-count" aria-live="polite"></span>
      <button id="find-prev" class="ico-btn" title="Précédent" data-i18n-title="find.prev" aria-label="Précédent" data-i18n-aria-label="find.prev"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <button id="find-next" class="ico-btn" title="Suivant" data-i18n-title="find.next" aria-label="Suivant" data-i18n-aria-label="find.next"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <button id="find-close" class="ico-btn" title="Fermer" data-i18n-title="common.close" aria-label="Fermer" data-i18n-aria-label="common.close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
  </main>

  <div id="panel-backdrop"></div>
  <aside id="panel" class="panel hidden" role="dialog" aria-label="Panneau" data-i18n-aria-label="panel.label">
    <div class="panel-head"><span id="panel-title" data-i18n="panel.label">Panneau</span>
      <button id="panel-close" class="ico-btn" aria-label="Fermer" data-i18n-aria-label="common.close">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div id="panel-body"></div>
  </aside>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="kdl/kdl-promo.js" defer></script>
  <script src="ai/text-engine.js"></script>
  <script src="ai/privacy-filter.js"></script>
  <script src="ai/prompt-templates.js"></script>
  <script src="ai/ai-service.js"></script>
  <script src="reader/extractor.js"></script>
  <script src="reader/reader-controller.js"></script>
  <script src="bookmarks-core.js"></script>
  <script src="renderer.js"></script>
  <script src="chrome-extras.js"></script>
</body>
</html>
